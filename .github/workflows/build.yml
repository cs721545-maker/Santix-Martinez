name: Build Santix Martinez

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name "Santix Martinez" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Santix-Martinez-Windows
          path: dist/Santix Martinez.exe
